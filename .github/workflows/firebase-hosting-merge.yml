name: Test and deploy main to live
on:
  push:
    branches:
      - main
jobs:
  test_and_deploy:
    name: Test, then deploy rules and live site
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      # The Firestore emulator (for the e2e test) needs Java.
      - name: Set up Java for the Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache the Firestore emulator
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-15
      - name: Install and build
        run: npm ci && npm run build
      # Unit tests plus the e2e match against the emulator (E2E_REQUIRED: fail, never skip).
      - name: Test (unit + e2e against the emulator)
        run: npx -y firebase-tools@15 emulators:exec --only firestore,auth --project koejon-3059e "E2E_REQUIRED=true npm test"
      - name: Deploy Firestore rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KOEJON_3059E }}' > "$GOOGLE_APPLICATION_CREDENTIALS"
          # rules only — we use no composite indexes (firestore.indexes.json is empty)
          npx firebase-tools deploy --only firestore:rules --project koejon-3059e
      - name: Deploy to Firebase Hosting live channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KOEJON_3059E }}
          channelId: live
          projectId: koejon-3059e
