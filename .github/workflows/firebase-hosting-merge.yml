name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build && npm test
      - name: Deploy Firestore rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KOEJON_3059E }}' > "$GOOGLE_APPLICATION_CREDENTIALS"
          # rules only — we use no composite indexes (firestore.indexes.json is empty)
          npx firebase-tools deploy --only firestore:rules --project koejon-3059e
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KOEJON_3059E }}
          channelId: live
          projectId: koejon-3059e
