name: Test and preview pull request
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  test_and_preview:
    name: Test, then deploy a preview channel
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      # Previews of PRs into main get the prod build; everything else (PRs
      # into develop) gets the dev build. Job-wide so the firebase.json
      # predeploy rebuild in the deploy step sees it too.
      VITE_APP_VARIANT: ${{ github.event.pull_request.base.ref == 'main' && 'prod' || 'dev' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      # The Firestore emulator (for the e2e test) needs Java.
      - name: Set up Java for the Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache the Firestore emulator
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-15
      - name: Install and build
        run: npm ci && npm run build
      # Unit tests plus the e2e match against the emulator (E2E_REQUIRED: fail, never skip).
      - name: Test (unit + e2e against the emulator)
        run: npx -y firebase-tools@15 emulators:exec --only firestore,auth --project koejon-3059e "E2E_REQUIRED=true npm test"
      - name: Deploy to a Firebase Hosting preview channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KOEJON_3059E }}
          projectId: koejon-3059e
