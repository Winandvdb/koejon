  </defs>
  <rect width="512" height="512" fill="url(#felt)"/>
  <g transform="rotate(-12 256 256)">
    <rect x="132" y="146" width="150" height="214" rx="18" fill="#fffdf7" stroke="#0003" stroke-width="4"/>
    <text x="207" y="290" font-family="Georgia, 'Times New Roman', serif" font-size="130" text-anchor="middle" fill="#1a1a1a">♠</text>
  </g>
  <g transform="rotate(12 256 256)">
