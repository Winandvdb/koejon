    <text x="305" y="290" font-family="Georgia, 'Times New Roman', serif" font-size="130" text-anchor="middle" fill="#c62828">♥</text>
  </g>
  <rect x="56" y="392" width="400" height="76" rx="18" fill="#1a1a1a"/>
  <text x="256" y="447" font-family="ui-monospace, Menlo, monospace" font-size="56" font-weight="bold" letter-spacing="8" text-anchor="middle" fill="#fbbf24">DEV</text>
